name: goswmmin-minimal
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python>=3.8,<3.13
  
  # Essential scientific computing
  - numpy>=1.20.0
  - pandas>=1.3.0
  - matplotlib>=3.5.0
  
  # Utilities
  - tqdm>=4.60.0
  
  # Build essentials
  - pip
  - setuptools
  
  # Pip-only dependencies
  - pip:
    - wntr>=1.0.0
    - pyswmm>=2.0.0
