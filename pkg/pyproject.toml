[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goswmmin"
version = "0.3.0"
description = "Guided Operation of SWMM for Intermittent Networks: A package for SWMM-based simulations of Intermittent Water Supply Networks"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Omar Abdelazeem", email = "omaraliamer98@gmail.com" }
]
maintainers = [
    { name = "Omar Abdelazeem", email = "omaraliamer98@gmail.com" }
]
keywords = [
    "water supply",
    "intermittent water supply",
    "SWMM",
    "hydraulic modeling",
    "water distribution networks",
    "pressure dependent demand"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Operating System :: OS Independent"
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "wntr>=1.0.0",
    "pyswmm>=2.0.0",
    "tqdm>=4.60.0",
    "pathlib2; python_version<'3.4'"
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "isort>=5.0",
    "flake8>=3.8",
    "mypy>=0.900",
    "pre-commit>=2.15",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=0.15",
]
examples = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[project.urls]
Homepage = "https://github.com/omaraliamer/GOSWMMIN"
Documentation = "https://github.com/omaraliamer/GOSWMMIN#readme"
Repository = "https://github.com/omaraliamer/GOSWMMIN.git"
Issues = "https://github.com/omaraliamer/GOSWMMIN/issues"
Changelog = "https://github.com/omaraliamer/GOSWMMIN/blob/main/CHANGES.TXT"

[tool.setuptools]
packages = ["goswmmin"]
include-package-data = true

[tool.setuptools.package-data]
goswmmin = ["resources/*"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]